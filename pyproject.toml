[project]
name = "daily-dive"
version = "0.1.0"
description = "The Daily Dive — a Techmeme-style morning digest for the saltwater reef hobby"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pydantic>=2.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.60",
]
dev = [
    "pytest>=8.0",
    # Only for the workflow tests. PyYAML accepts duplicate keys silently and
    # GitHub does not, which is how a workflow with two `if:` on one step
    # passed a local check and then failed to start — see tests.
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[project.scripts]
daily-dive = "dailydive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dailydive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Bugs only, deliberately — not style.
#
# This project's real failures have all been behavioural: an argument the SDK
# does not accept, a write happening at the wrong point in a run, a label
# nobody applied. A linter would have caught none of them, and the tests that
# do catch them are the ones worth writing. So the ruleset is scoped to things
# that are wrong rather than things that are unfashionable — an undefined name,
# a mutable default, an except clause that cannot be reached — and it stays
# quiet the rest of the time. A noisy check is one people learn to skip.
#
#   F    pyflakes: undefined names, unused imports, f-strings with no fields
#   E9   syntax and IO errors
#   B    bugbear: mutable defaults, loop-variable closures, unused loop control
#   PLE  pylint's error class only, never its conventions
select = ["F", "E9", "B", "PLE"]

[tool.ruff.format]
# Not used. Formatting is not enforced here; reformatting a file this size
# would bury the history of every line in it for no defect fixed.
exclude = ["*"]
