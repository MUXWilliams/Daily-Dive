[project]
name = "daily-dive"
version = "0.1.0"
description = "The Daily Dive — a Techmeme-style morning digest for the saltwater reef hobby"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pydantic>=2.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
daily-dive = "dailydive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dailydive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
