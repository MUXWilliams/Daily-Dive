[project]
name = "daily-dive"
version = "0.1.0"
description = "The Daily Dive — a Techmeme-style morning digest for the saltwater reef hobby"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "pydantic>=2.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.60",
]
dev = [
    "pytest>=8.0",
    # Only for the workflow tests. PyYAML accepts duplicate keys silently and
    # GitHub does not, which is how a workflow with two `if:` on one step
    # passed a local check and then failed to start — see tests.
    "pyyaml>=6.0",
]

[project.scripts]
daily-dive = "dailydive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dailydive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
