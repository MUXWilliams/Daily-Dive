name: Build issue

# Weekly, plus manual runs whenever you want one. GitHub's runners have full
# internet access, so workflow_dispatch is also how real feeds get tested.
#
# Weekly rather than daily because the sources say so: ~19 publishable items
# per 14-day window, which is a good weekly issue and a very thin daily one.
# See the volume table any run prints.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Only this source id (blank = all enabled sources)"
        required: false
        default: ""
      limit:
        description: "Max items (blank = no cap)"
        required: false
        default: ""
      probe:
        description: "Also test candidate feed URLs and report which ones work"
        type: boolean
        required: false
        default: false
      probe_urls:
        description: "Probe only these URLs (space-separated). Skips the build, so the verdicts land at the end of the log."
        required: false
        default: ""
      score:
        description: "Run the AI scoring pass (needs the ANTHROPIC_API_KEY secret — costs a few cents)"
        type: boolean
        required: false
        default: false
      mailcheck:
        description: "Verify the newsletter mailbox and list its senders (publishes nothing)"
        type: boolean
        required: false
        default: false
      sendcheck:
        description: "Verify the mailing-list API key by reading the list (sends nothing)"
        type: boolean
        required: false
        default: false
      threshold:
        description: "Minimum relevance to publish, 0-1 (blank = 0.45). Only used with scoring."
        required: false
        default: ""
      send:
        description: "Email the issue to the list. Off by default, including on the schedule — an inbox cannot be un-sent."
        type: boolean
        required: false
        default: false
  schedule:
    # Friday 10:00 UTC — 6am US Eastern in summer, 5am in winter. Cron has no
    # notion of daylight saving, so the local hour shifts by one twice a year;
    # that is the accepted cost of not running a timezone-aware scheduler.
    - cron: "0 10 * * 5"

# A publishing run needs three grants beyond the default read: contents to
# commit the issue and the archive DB back, and pages + id-token for the
# deploy. Nothing else in the workflow writes anything.
permissions:
  contents: write
  pages: write
  id-token: write
  # Read the editor's pick bucket, then comment on and close what it used.
  issues: write

# One deploy at a time, and never cancel one in flight — a half-written Pages
# deploy is a broken site, which is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,ai]"

      - name: Tests
        run: pytest -q

      # Fail here rather than 30 seconds into a live fetch. Without this the
      # run would ingest every feed, then die at the first model call with an
      # authentication error — and you'd be reading a stack trace instead of a
      # sentence telling you which secret is missing.
      - name: Check the API key is present
        if: inputs.score || github.event_name == 'schedule'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Scoring was requested but the ANTHROPIC_API_KEY secret isn't set." >&2
            echo "Add it under Settings -> Secrets and variables -> Actions -> New repository secret." >&2
            exit 1
          fi
          echo "Key found. Scoring is enabled for this run."

      # Publishes nothing and builds nothing: it opens the mailbox read-only
      # and reports what is in it, which is how the sender allowlist gets
      # filled in with real addresses rather than guessed ones.
      - name: Check the newsletter mailbox
        if: inputs.mailcheck
        env:
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: |
          if [ -z "$IMAP_PASSWORD" ]; then
            echo "IMAP_PASSWORD secret is not set." >&2
            exit 1
          fi
          daily-dive mailcheck

      # A read, never a send. The first thing this project does against a new
      # service should not be the irreversible thing — the same reason
      # mailcheck opens the mailbox readonly. Also the only way to prove the
      # API constants in deliver.py are right, since they were written without
      # the documentation reachable.
      - name: Check the mailing-list key
        if: inputs.sendcheck
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ -z "$BUTTONDOWN_API_KEY" ]; then
            echo "BUTTONDOWN_API_KEY secret is not set." >&2
            exit 1
          fi
          daily-dive send --check

      # What the send would actually post, with the key redacted. Needs no
      # secret and reaches no network, so it is safe to run at any time and
      # safe to paste anywhere.
      - name: Show the request a send would make
        if: inputs.sendcheck
        run: daily-dive send --fixture --dry-run

      - name: List configured sources
        run: daily-dive sources

      # Skipped when specific URLs were asked about: the point of a targeted
      # probe is to read its verdicts, and a --verbose build buries them under
      # thousands of lines of HTTP debug output. The probe itself runs last,
      # for the same reason — every step after it echoes its own script into
      # the log, which pushed the table out of reach twice.
      - name: Build issue from live feeds
        id: build
        # sendcheck joins probe_urls as a reason not to build. Without this a
        # dispatch that only wanted to verify the API key would build an
        # UNSCORED issue and publish it over the live site, because a full run
        # with no --source or --limit passes the publish gate.
        if: inputs.probe_urls == '' && !inputs.sendcheck
        continue-on-error: true
        env:
          # Absent unless the secret is set; the CLI only reads it under --score,
          # so an unscored run is unaffected by a missing key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this the five video sources are skipped with a warning and
          # the rest of the issue builds normally.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # The newsletter mailbox. Without these the IMAP sources are skipped
          # with a warning and the rest of the issue builds normally.
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          # The pick bucket. Supplied by Actions, not a secret we manage — and
          # without it the picks section is skipped, not the issue.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Inputs as data, not as script text — see the note on the probe step.
          IN_SOURCE: ${{ inputs.source }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_THRESHOLD: ${{ inputs.threshold }}
          IN_SCORE: ${{ inputs.score || github.event_name == 'schedule' }}
          # The mailing list. Absent unless the secret is set; the CLI only
          # reads it under --send, so an unsent run is unaffected.
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          # Deliberately NOT defaulted true on the schedule, unlike scoring.
          # A page can be redeployed; an inbox cannot be un-sent, so sending
          # stays something a human turns on for a given run.
          IN_SEND: ${{ inputs.send }}
        run: |
          ARGS=""
          if [ -n "$IN_SOURCE" ]; then ARGS="$ARGS --source $IN_SOURCE"; fi
          if [ -n "$IN_LIMIT" ]; then ARGS="$ARGS --limit $IN_LIMIT"; fi
          # inputs.* are empty on a schedule event, so without this the weekly
          # run would quietly build an unscored issue.
          if [ "$IN_SCORE" = "true" ]; then
            ARGS="$ARGS --score"
          fi
          if [ -n "$IN_THRESHOLD" ]; then ARGS="$ARGS --threshold $IN_THRESHOLD"; fi
          if [ "$IN_SEND" = "true" ]; then ARGS="$ARGS --send"; fi
          # --print puts the issue in the log as text. The page ships as an
          # artifact, but reviewing the editorial judgment shouldn't require
          # downloading and unzipping anything.
          ARGS="$ARGS --print"
          echo "daily-dive run $ARGS --verbose"
          # Tee so the summary step can report per-source results even on failure.
          set -o pipefail
          daily-dive run $ARGS --verbose 2>&1 | tee run.log

      # Only when the build actually ran. site/ is committed, so on a skipped
      # build these steps found last week's page on disk and reported it as
      # this run's output — "Built the page", with last week's headlines under
      # it, on a run that built nothing.
      - name: Summarize what each feed returned
        # always() so this still runs when the build FAILED — the feed table and
        # the artifact are most wanted exactly then. The skipped test is
        # separate: a build that never ran produced nothing to describe.
        if: always() && steps.build.outcome != 'skipped'
        run: |
          {
            echo "### Feed check"
            echo ""
            if [ -f run.log ]; then
              echo "| Source | Result |"
              echo "|---|---|"
              # One row per source: "<id>: N items" on success, or the error.
              # Anchored on our own log prefix so stack-trace lines don't
              # masquerade as sources.
              grep -E "dailydive: [a-z0-9-]+: [0-9]+ items" run.log \
                | sed -E 's/.*dailydive: ([a-z0-9-]+): ([0-9]+) items.*/| \1 | ✅ \2 items |/' || true
              grep -E "dailydive: (failed|skipping) [a-z0-9-]+:" run.log \
                | sed -E 's/.*dailydive: (failed|skipping) ([a-z0-9-]+): (.*)/| \2 | ❌ \3 |/' || true
              echo ""
              # Scoring economics, straight from the run's own token accounting.
              # Worth reading every time: if the cache hit rate is 0% across
              # runs something is invalidating the cached system prompt, and
              # the bill is several times what it should be.
              if grep -q "^  total: \$" run.log; then
                echo "### Scoring"
                echo ""
                grep -E "dailydive: scored [0-9]+ items, kept [0-9]+" run.log \
                  | sed -E 's/.*dailydive: (scored.*)/\1./' || true
                echo ""
                echo '```'
                grep -E "^  (score|write|ground|total): " run.log || true
                echo '```'
                echo ""
              fi
            fi
            if [ -f site/index.html ]; then
              echo "Built the page — download the **site** artifact below to open it."
              echo ""
              echo "<details><summary>Headlines pulled</summary>"
              echo ""
              grep -o 'class="headline"[^>]*>[^<]*' site/index.html \
                | sed 's/.*>//' | sed 's/^/- /' || true
              echo ""
              echo "</details>"
            else
              echo "**No page was built.** See the log for why."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload the built page
        # always() so this still runs when the build FAILED — the feed table and
        # the artifact are most wanted exactly then. The skipped test is
        # separate: a build that never ran produced nothing to describe.
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            site/
            run.log
          if-no-files-found: warn

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "The build step failed — see the Feed check summary." >&2
          exit 1

      # ---------------------------------------------------------- publishing
      #
      # Deliberately gated. A --source or --limit run builds a knowingly
      # partial issue, and Pages replaces the entire site on every deploy, so
      # publishing one would swap a real issue for a test — silently, and until
      # someone noticed next Friday.
      - name: Decide whether this run publishes
        id: gate
        if: always()
        env:
          IN_SOURCE: ${{ inputs.source }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_PROBE_URLS: ${{ inputs.probe_urls }}
          IN_SENDCHECK: ${{ inputs.sendcheck }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          reason=""
          # Deliberate skips first. BUILD_OUTCOME is "skipped" — not "success" —
          # when the build was intentionally not run, so testing it first
          # reported a key check as "the build did not succeed", which reads as
          # a failure on a green run.
          if [ "$IN_SENDCHECK" = "true" ]; then
            reason="this run was a key check, not a build"
          elif [ ! -f .run-built ]; then
            # The marker, not the exit code. A refused email used to fail the
            # build step and skip the deploy, so losing the copy lost the
            # original. The marker says "this run wrote a page", which is the
            # actual precondition for publishing — and site/index.html alone
            # cannot say it, because site/ is committed.
            reason="this run did not build a page"
          elif [ -n "$IN_SOURCE$IN_LIMIT$IN_PROBE_URLS" ]; then
            reason="this is a partial run (source, limit or probe_urls was set)"
          fi
          if [ -n "$reason" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Not publishing: $reason." | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Two things have to outlive the runner, and neither did until now.
      #
      # The dated permalinks, because a Pages deploy replaces the whole site —
      # an issue that is not committed disappears from the live site the moment
      # the next one ships, and its permalink 404s.
      #
      # And dailydive.sqlite3, which is the dedupe memory and the HTTP cache.
      # Every scheduled run has been starting from an empty database, so
      # known_uids had nothing to compare against and conditional GET never
      # engaged. The code was right; the file was being thrown away.
      - name: Commit the issue and the archive
        if: steps.gate.outputs.publish == 'true'
        run: |
          # The bot address, not a personal one: commit emails are public and
          # permanent, and fixing them later means rewriting history.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A over an explicit file list: git add fails the step outright on a
          # path that does not exist, and the DB is absent on a first run.
          git add -A site
          [ -f dailydive.sqlite3 ] && git add dailydive.sqlite3 || true
          if git diff --staged --quiet; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git commit -m "Issue for $(date -u +%Y-%m-%d) [skip ci]"
          # A weekly job racing a human push is unlikely but cheap to survive.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed, rebasing and retrying ($attempt/3)..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 4))
          done
          echo "Could not push the issue after three attempts." >&2
          exit 1

      - name: Configure Pages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Package the site
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to Pages
        id: deploy
        if: steps.gate.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

      # Every input below reaches the shell through `env:` rather than through
      # ${{ }} interpolation. Two reasons, and the first one already bit:
      #
      #   1. Interpolation pastes the value into the script text, so a URL
      #      containing & — which every API query does — is read by bash as a
      #      control operator and the command is torn into background jobs.
      #      That failed silently here: the step "succeeded" in zero seconds
      #      having probed nothing.
      #   2. It is also how script injection works. Anyone who can dispatch
      #      this workflow could otherwise run arbitrary commands on the
      #      runner, with the secrets in scope.
      #
      # Read through $VAR, the value is data. set -f stops the ? in a query
      # string being treated as a glob.
      # After the deploy, deliberately. The page is the canonical artifact and
      # the email is a copy of it; a refused send has to turn the run red
      # without ever costing the issue its publication.
      - name: Fail if the send was refused
        if: always()
        run: |
          if [ -f .send-failed ]; then
            echo "The issue published, but the email was refused:" >&2
            cat .send-failed >&2
            exit 1
          fi

      - name: Probe candidate feed URLs
        if: inputs.probe || inputs.probe_urls != ''
        env:
          PROBE_URLS: ${{ inputs.probe_urls }}
        run: |
          set -f
          # tee, not redirect: the step summary is the readable form, but the
          # verdicts also need to be in the log, which is the only place a
          # tool (or a person on a restricted network) can actually get at them.
          #
          # With explicit URLs, --discover is dropped: discovery walks a fixed
          # list of pages and has nothing to do with the URLs you asked about.
          {
            echo "### Candidate feed probe"
            echo ""
            if [ -n "$PROBE_URLS" ]; then
              # Unquoted on purpose: the input is a space-separated list and
              # word splitting is what turns it into separate arguments.
              daily-dive probe --markdown $PROBE_URLS 2>/dev/null || true
            else
              daily-dive probe --markdown --discover 2>/dev/null || true
            fi
            echo ""
          } | tee -a $GITHUB_STEP_SUMMARY
