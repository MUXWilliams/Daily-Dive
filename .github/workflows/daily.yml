name: Build issue

# Manual for now. GitHub's runners have full internet access, so this is the
# easiest way to test real feeds without a local setup.
#
# The daily schedule stays commented out until v3, when there's something worth
# publishing. Uncomment then — 09:30 UTC is roughly 5:30am US Eastern.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Only this source id (blank = all enabled sources)"
        required: false
        default: ""
      limit:
        description: "Max items (blank = no cap)"
        required: false
        default: ""
  # schedule:
  #   - cron: "30 9 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: List configured sources
        run: daily-dive sources

      - name: Build issue from live feeds
        id: build
        continue-on-error: true
        run: |
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then ARGS="$ARGS --source ${{ inputs.source }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          echo "daily-dive run $ARGS --verbose"
          # Tee so the summary step can report per-source results even on failure.
          set -o pipefail
          daily-dive run $ARGS --verbose 2>&1 | tee run.log

      - name: Summarize what each feed returned
        if: always()
        run: |
          {
            echo "### Feed check"
            echo ""
            if [ -f run.log ]; then
              echo "| Source | Result |"
              echo "|---|---|"
              # One row per source: "<id>: N items" on success, or the error.
              grep -E "dailydive: [a-z0-9-]+: [0-9]+ items" run.log \
                | sed -E 's/.*dailydive: ([a-z0-9-]+): ([0-9]+) items.*/| \1 | ✅ \2 items |/' || true
              grep -E "(failed|skipping) [a-z0-9-]+" run.log \
                | sed -E 's/.*(failed|skipping) ([a-z0-9-]+):? ?(.*)/| \2 | ❌ \3 |/' || true
              echo ""
            fi
            if [ -f site/index.html ]; then
              echo "Built the page — download the **site** artifact below to open it."
              echo ""
              echo "<details><summary>Headlines pulled</summary>"
              echo ""
              grep -o 'class="headline"[^>]*>[^<]*' site/index.html \
                | sed 's/.*>//' | sed 's/^/- /' || true
              echo ""
              echo "</details>"
            else
              echo "**No page was built.** See the log for why."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload the built page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            site/
            run.log
          if-no-files-found: warn

      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "The build step failed — see the Feed check summary." >&2
          exit 1
