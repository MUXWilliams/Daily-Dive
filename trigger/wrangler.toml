# The Cloudflare Worker that starts the weekly issue on time.
# See trigger/README.md for setup, and worker.js for why it exists.
name = "weekly-dive-trigger"
main = "worker.js"
compatibility_date = "2026-08-31"

# No routes and no HTTP handler: this Worker is reachable only by its own cron,
# so there is nothing on the internet for anyone to call.
workers_dev = false

[triggers]
# Friday 7 a.m. Pacific. Cron here is UTC and ignores daylight saving, so this
# fires at both hours that can be 7 a.m. in Los Angeles — 14:00 UTC under PDT,
# 15:00 under PST — and worker.js dispatches only on the one that is. A test
# walks a full year of Fridays and checks exactly one goes ahead each week.
crons = ["0 14 * * 5", "0 15 * * 5"]
