# ---------------------------------------------------------------------- forums

# BLOCKED — all four XenForo feed shapes return 403:
#   /forums/-/index.rss   /whats-new/posts/index.rss
#   /index.rss            /forums/index.rss
# Four different paths failing identically is a site-level block, not a wrong
# URL. Reef2Reef does not want automated clients reading its feeds.
#
# The answer is to ask, not to route around it. Forging a browser User-Agent
# would get past this and would undo the entire good-citizen posture the
# project depends on — and Reef2Reef is exactly the outlet whose goodwill
# matters most here. Email them, explain the project, ask about an aggregator
# exception or a partnership. Until then this stays off.
[[source]]
id = "reef2reef"
name = "Reef2Reef"
url = "https://www.reef2reef.com/forums/-/index.rss"
type = "xenforo"
category_hint = "Community"
enabled = false

# BLOCKED — 403, same story as Reef2Reef. Worth an email rather than a
# workaround; it's a low-volume, high-signal publication.
[[source]]
id = "reefhobbyist"
name = "Reef Hobbyist Magazine"
url = "https://reefhobbyistmagazine.com/feed/"
type = "wordpress"
category_hint = "Husbandry & Science"
enabled = false

# PARKED — Reddit's robots.txt disallows crawling the .rss endpoints, and the
# fetcher correctly refused. This is not a bug to route around: the sanctioned
# path is Reddit's official OAuth API, which has a free tier and is explicitly
# for this. Wire that up as its own source type rather than ignoring robots.txt.
[[source]]
id = "reddit-reeftank"
name = "r/ReefTank"
url = "https://www.reddit.com/r/ReefTank/new/.rss"
type = "reddit"
section = "new"
category_hint = "Community"
enabled = false

# ----------------------------------------------------------------------- video
#
# YouTube Data API v3, not the per-channel RSS feed. The RSS path is disallowed
# by youtube.com/robots.txt and the fetcher refused all five channels on the
# first live run; the API is the access YouTube actually sanctions.
#
# The playlist id is the channel id with UC swapped for UU — every channel's
# uploads live in an auto-maintained playlist with that id. Using it means one
# playlistItems.list call per channel at 1 quota unit, instead of search.list
# at 100. Five channels daily is ~5 units against a free 10,000/day.
#
# Needs YOUTUBE_API_KEY in the environment. The key is never written here.

[[source]]
id = "yt-brs"
name = "BRStv"
url = "https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=15&playlistId=UUGGM8r6qjSRqPy9eAIFT32w"
type = "youtube_api"
section = "Bulk Reef Supply"
category_hint = "Video"

