# --------------------------------------------------------- primary literature
#
# The deep-science block, and the reason to read this digest over the trade
# press: papers, not press releases. A reefkeeper's technique comes out of this
# literature a few years before it reaches a product page, and nobody in the
# hobby aggregates it.
#
# Verified live 2026-08-15: 20 entries, newest 1 day old. Gold open access, so
# every link goes to a full paper rather than a paywall — which matters more
# here than anywhere else in this file, since a citation nobody can read is not
# much of a citation.
#
# This feed is deliberately wider than our subject: it carries all of marine
# science, and the newest item when verified was about ESG competencies in port
# management. That is fine, and it is why prompts/score.system.md is a subject
# test rather than a quality test — Frontiers supplies candidates and the scorer
# decides which two or three belong in an issue. Expect a low keep rate here by
# design. If it ever runs at ten items an issue, the threshold is wrong.
#
# Two nearby sources that did NOT survive the probe, recorded so nobody retries
# them from the same document: the JZAR OJS gateway path 404s (the journal is
# real and worth another look for the correct path), and drumandcroaker.org
# serves a static PDF archive that advertises no feed at all.
[[source]]
id = "frontiers-marine"
name = "Frontiers in Marine Science"
url = "https://www.frontiersin.org/journals/marine-science/rss"
type = "generic"
section = "Journal"
category_hint = "Husbandry & Science"

# --- OpenAlex ----------------------------------------------------------------
#
# One source type, many outlets. OpenAlex indexes the literature rather than
# publishing it, so `name` below is only a fallback label for listings: each
# paper is credited to its own journal, read from the record. Crediting a
# Coral Reefs paper to OpenAlex would be a plain miscredit, and
# normalize._normalize_openalex drops any work whose journal it cannot
# determine rather than inventing one.
#
# {since} becomes a real date at fetch time — see ingest.resolve_window. The
# query reaches back 21 days against a 7-day publishing window on purpose:
# indexing lags publication, so a 7-day query would miss papers that are new
# to us. normalize.recent still does the real windowing.
#
# Both filters below were arrived at by probe, and every clause earns its
# place. The counts are per 21-day window:
#
#   title_and_abstract.search:coral   373   too broad — "coral" is a colour,
#                                            a snake, and a person's name
#   title.search:coral                178   still 59/week
#   + type:article                     72   the fix: OpenAlex indexes datasets
#                                            and preprints too, and the first
#                                            query's top hit was a temperature
#                                            logger series, not a paper
#
# is_oa:true is editorial, not technical: a citation the reader cannot open is
# not worth much, so this asks only for papers they can actually read.
#
# The mailto is OpenAlex's documented request — it puts us in their polite
# pool. It is the public contact address, the same one on the about page.
#
# Probed empty, recorded so nobody adds it: title_and_abstract.search:
# "public aquarium" matches nothing at all, and "reef aquarium" likewise. The
# hobby is not a term of art in this literature. Public-aquarium work is
# weighted up in prompts/score.system.md instead, where it applies to items
# from every source rather than to a query that returns nothing.
[[source]]
id = "openalex-coral"
name = "OpenAlex"
url = "https://api.openalex.org/works?filter=title.search:coral,type:article,primary_location.source.type:journal,from_publication_date:{since},is_oa:true&sort=publication_date:desc&per-page=100&mailto=theloneaquarist@gmail.com"
type = "openalex"
section = "Journal"
category_hint = "Husbandry & Science"

# Coral is not the whole subject. Reef fish behaviour, disease and physiology
# are the other half of what a reefkeeper actually manages, and this query
# catches papers a coral-titled search cannot: 15 per 21-day window, verified,
# newest "Reef fish escape responses selectively match predator attack" in
# PLoS ONE.
#
# title_and_abstract rather than title here because "reef fish" is a phrase
# that shows up in an abstract's framing more often than in a title, and the
# phrase is specific enough that the wider net stays clean.
[[source]]
id = "openalex-reef-fish"
name = "OpenAlex"
url = "https://api.openalex.org/works?filter=title_and_abstract.search:%22reef%20fish%22,type:article,primary_location.source.type:journal,from_publication_date:{since},is_oa:true&sort=publication_date:desc&per-page=100&mailto=theloneaquarist@gmail.com"
type = "openalex"
section = "Journal"
category_hint = "Husbandry & Science"

# ------------------------------------------------------------- newsletters
#
# Read over IMAP from the `digest` Gmail label. One source per sender, not one
# source for the mailbox: every item has to be credited to the outlet that
# actually wrote it, and a single "newsletters" source would have credited a
# Quality Marine announcement to something else entirely. That is the whole
# attribution promise, so the config shape has to enforce it.
#
# `senders` is a security control. An inbox is an untrusted input — anyone who
# learns the address can mail it — so only these addresses contribute, and an
# empty list refuses everything. With exactly one sender the filtering also
# happens server-side, so a source never downloads another source's mail.
#
# Verified present in the mailbox 2026-08-14.

# The publisher of CORAL and AMAZONAS — editorial, not retail. The strongest
# of these by a distance, and a second route to CORAL's reporting alongside
# the (bi-monthly, therefore quiet) coralmagazine.com feed.
[[source]]
id = "mail-aquaticmedia"
name = "Aquatic Media Press"
url = "imap://imap.gmail.com/digest"
type = "imap"
section = "Newsletter"
category_hint = "Industry & Products"
senders = ["editors@aquaticmediapress.com"]

# NOAA National Ocean Service via GovDelivery. US government work, so the
