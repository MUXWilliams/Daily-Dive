# The Daily Dive — source list.
#
# This is the file you'll edit most. One [[source]] block per feed.
#
#   id            stable slug, used in the DB and on the CLI (--source <id>)
#   name          how the outlet is CREDITED on the page. Get this right.
#   url           the feed itself
#   type          wordpress | xenforo | youtube | reddit | generic
#   section       forum / subreddit / channel, when the outlet name is too coarse
#   category_hint provisional bucket until v1's scoring pass assigns for real
#   enabled       false parks a source without deleting its config
#
# RULE: RSS/API only. If a source has no feed, it does not go in here. No
# scraping, no headless browser. That is what keeps this cheap, unbrittle, and
# welcome.

# ---------------------------------------------------------------- publications

[[source]]
id = "reefbuilders"
name = "Reef Builders"
url = "https://reefbuilders.com/feed/"
type = "wordpress"
category_hint = "Industry & Products"

# PARKED — reef2rainforest.com no longer resolves (DNS: "No address associated
# with hostname"), so the publisher appears to have moved. coralmagazine.com
# looks like the current home. Run the workflow with probe=true to find the
# working feed URL, then swap it in and re-enable.
[[source]]
id = "reef2rainforest"
name = "CORAL Magazine"
url = "https://www.coralmagazine.com/feed/"
type = "wordpress"
category_hint = "Husbandry & Science"
enabled = false

# ---------------------------------------------------------------------- forums

# PARKED — the site-wide XenForo feed returns 403 Forbidden. That is usually
# bot protection rather than a wrong path, but probe=true tests the other
# XenForo feed shapes to tell the difference.
#
# If they're blocking aggregators deliberately, the answer is to ask, not to
# work around it: a 403 is a site saying no, and forging a browser User-Agent
# to get past it would undo the whole good-citizen posture this project runs on.
#
# Per-forum feeds (higher signal than the firehose) follow the same shape:
# /forums/<slug>.<id>/index.rss — the id is visible in the URL of any forum.
[[source]]
id = "reef2reef"
name = "Reef2Reef"
url = "https://www.reef2reef.com/forums/-/index.rss"
type = "xenforo"
category_hint = "Community"
enabled = false

# PARKED — Reddit's robots.txt disallows crawling the .rss endpoints, and the
# fetcher correctly refused. This is not a bug to route around: the sanctioned
# path is Reddit's official OAuth API, which has a free tier and is explicitly
# for this. Wire that up as its own source type rather than ignoring robots.txt.
[[source]]
id = "reddit-reeftank"
name = "r/ReefTank"
url = "https://www.reddit.com/r/ReefTank/new/.rss"
type = "reddit"
section = "new"
category_hint = "Community"
enabled = false

# ----------------------------------------------------------------------- video
#
# YouTube per-channel RSS needs the UC... channel ID, not the @handle, and
# there's no handle-based feed endpoint. To get an ID: open the channel, View
# Source, search for "channelId". Then fill it in below and flip enabled = true.
#
# These three are parked because the IDs below are placeholders — I had no
# network access to resolve them, and a wrong ID fails silently as an empty
# feed rather than an error, which is the worst kind of bug to inherit.

[[source]]
id = "yt-brs"
name = "BRStv"
url = "https://www.youtube.com/feeds/videos.xml?channel_id=REPLACE_ME"
type = "youtube"
section = "Bulk Reef Supply"
category_hint = "Video"
enabled = false

[[source]]
id = "yt-tidalgardens"
name = "Tidal Gardens"
