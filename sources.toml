# ----------------------------------------------------------------------- video
#
# YouTube Data API v3, not the per-channel RSS feed. The RSS path is disallowed
# by youtube.com/robots.txt and the fetcher refused all five channels on the
# first live run; the API is the access YouTube actually sanctions.
#
# The playlist id is the channel id with UC swapped for UU — every channel's
# uploads live in an auto-maintained playlist with that id. Using it means one
# playlistItems.list call per channel at 1 quota unit, instead of search.list
# at 100. Five channels daily is ~5 units against a free 10,000/day.
#
# Needs YOUTUBE_API_KEY in the environment. The key is never written here.
#
# No category_hint: there is no Video category. A video is filed by what it is
# about, so the scoring pass assigns the section from the subject.

[[source]]
id = "yt-brs"
