# ---------------------------------------------------------------------- forums

# BLOCKED — all four XenForo feed shapes return 403:
#   /forums/-/index.rss   /whats-new/posts/index.rss
#   /index.rss            /forums/index.rss
# Four different paths failing identically is a site-level block, not a wrong
# URL. Reef2Reef does not want automated clients reading its feeds.
#
# The answer is to ask, not to route around it. Forging a browser User-Agent
# would get past this and would undo the entire good-citizen posture the
# project depends on — and Reef2Reef is exactly the outlet whose goodwill
# matters most here. Email them, explain the project, ask about an aggregator
# exception or a partnership. Until then this stays off.
[[source]]
id = "reef2reef"
name = "Reef2Reef"
url = "https://www.reef2reef.com/forums/-/index.rss"
type = "xenforo"
category_hint = "Community"
