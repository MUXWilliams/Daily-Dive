# ------------------------------------------------------------- newsletters
#
# Read over IMAP from the `digest` Gmail label. One source per sender, not one
# source for the mailbox: every item has to be credited to the outlet that
# actually wrote it, and a single "newsletters" source would have credited a
# Quality Marine announcement to something else entirely. That is the whole
# attribution promise, so the config shape has to enforce it.
#
# `senders` is a security control. An inbox is an untrusted input — anyone who
# learns the address can mail it — so only these addresses contribute, and an
# empty list refuses everything. With exactly one sender the filtering also
# happens server-side, so a source never downloads another source's mail.
#
# Verified present in the mailbox 2026-08-14.

# The publisher of CORAL and AMAZONAS — editorial, not retail. The strongest
# of these by a distance, and a second route to CORAL's reporting alongside
# the (bi-monthly, therefore quiet) coralmagazine.com feed.
[[source]]
id = "mail-aquaticmedia"
name = "Aquatic Media Press"
url = "imap://imap.gmail.com/digest"
type = "imap"
section = "Newsletter"
category_hint = "Industry & Products"
senders = ["editors@aquaticmediapress.com"]

# NOAA National Ocean Service via GovDelivery. US government work, so the
# content is public domain — the one source here with no licensing question
# at all. Broad ocean-service coverage, so expect the scorer to drop a lot.
[[source]]
id = "mail-noaa"
name = "NOAA National Ocean Service"
url = "imap://imap.gmail.com/digest"
type = "imap"
section = "Newsletter"
category_hint = "Wild Reefs"
senders = ["nosnoaa@public.govdelivery.com"]

