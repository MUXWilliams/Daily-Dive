# Aquarium-equipment ownership map, machine-readable.
#
# Derived from docs/industry-brief.md — that file is the editorial authority and
# carries the sourcing, verification, and language rules. This file is the part
# a program can act on: who owns whom, and what names to watch for.
#
# kind:
#   sponsor       private-equity or holding entity at the top of a chain
#   parent        operating parent that owns brands
#   manufacturer  makes its own products; may be independently owned
#   brand         a product line, NOT an independent company
#
# parent: id of the entity directly above this one. Chains resolve upward, so
# a match on "Radion" reports EcoTech Marine -> Aperture -> Bertram Capital.
#
# ambiguous_aliases: real aliases that are too generic to match on automatically.
# They are kept for the record and for a human reading a story, but the matcher
# ignores them — "AI" would otherwise fire on every mention of artificial
# intelligence, and "Prime", "Blade", "Jump", and "Speedy" are ordinary words.
#
# Baseline verified 2026-08-13. Ownership changes; see the maintenance protocol
# in docs/industry-brief.md before treating any of this as current.

